name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "1.9"
          - "2.0"
          - "2.1"
          - "2.2"
          - "2.3"
          - "2.4"
          - "2.5"
          - "2.6"
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - head
        include:
          - ruby: head
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker buildx bake --load "ruby-${RUBY//\./-}"
        env:
          RUBY: ${{ matrix.ruby }}
      - name: Test
        run: docker run --rm "kss-test:${{ matrix.ruby }}"

  gate:
    name: All Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: ${{ !success() }}
        run: exit 1
